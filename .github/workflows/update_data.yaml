name: RBI Card Data Sync Pipeline

on:
  schedule:
    # Twice daily, in UTC. IST is a fixed UTC+5:30 with no daylight saving, so:
    #   05:30 UTC = 11:00 AM IST
    #   12:30 UTC =  6:00 PM IST
    # GitHub Actions cron can be delayed a few minutes under platform load, so
    # treat these as targets rather than exact guarantees.
    - cron: '30 5,12 * * *'
  workflow_dispatch: # Allows manual trigger execution testing via GitHub UI

# Prevent overlapping runs if a manual trigger fires while a scheduled run is
# still going — avoids two commits racing on data.json.
concurrency:
  group: rbi-data-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-pipeline-automation:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Configure Python Infrastructure Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Pinned Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Extraction Scraper Pipeline
      run: python scraper.py

    - name: Commit and Push Compiled Data JSON Changes
      run: |
        git config --global user.name "Automated Data Ingestion Action"
        git config --global user.email "actions@github.com"
        git add data.json
        # scraper.py stamps a fresh generated_at on every successful run, so this
        # commits on each run. That is deliberate: the dashboard's freshness
        # indicator reads generated_at to prove the pipeline is alive, and would
        # otherwise report "stale" during the ~30 days between RBI publications.
        git diff --quiet && git diff --staged --quiet || (git commit -m "System Sync: Compiled latest RBI Card Data Matrix" && git push)
